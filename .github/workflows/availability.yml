name: Public Availability

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: public-availability
  cancel-in-progress: false

jobs:
  check:
    if: vars.PARSITASKS_MONITORING_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Check public pages and authentication boundaries
        id: probe
        continue-on-error: true
        run: npm run check:availability
      - name: Confirm failure before raising an incident
        id: retry
        if: steps.probe.outcome == 'failure'
        continue-on-error: true
        run: npm run check:availability
      - name: Open one incident or resolve it after recovery
        if: ${{ !cancelled() && steps.probe.outcome != 'skipped' }}
        run: node scripts/availability-incident.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARSITASKS_HEALTHY: ${{ steps.probe.outcome == 'success' || steps.retry.outcome == 'success' }}
          PARSITASKS_INCIDENT_WEBHOOK: ${{ secrets.PARSITASKS_INCIDENT_WEBHOOK }}
      - name: Fail a confirmed outage
        if: steps.probe.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: exit 1
